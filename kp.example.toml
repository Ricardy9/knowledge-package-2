# Copy to kp.toml (git-ignored) and edit. `python -m kp init` does the copy for you.

[project]
name = "My knowledge product"
lead = "Name of the Lead"

[evidence]
# "local": Claude Code answers questions from inputs/corpus using `python -m kp search`.
# "notebooklm": you run each query pack in NotebookLM and paste the answers into package/05_evidence.
engine = "local"
# Earliest source date that can close a "still holds?" question (YYYY-MM-DD). Leave empty to require one per question.
recency_floor = ""

[pack]
# Maximum questions per query pack.
size = 10

[handoff]
# Title printed at the top of each handoff .docx. Defaults to the project name.
title = ""
